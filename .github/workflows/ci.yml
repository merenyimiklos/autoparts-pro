name: CI
on:
  push:
    branches: [main, 'agent/**']
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run prisma:generate -w @autoparts/api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: docker compose up -d --build
      - run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:3000/ >/dev/null && curl -fsS http://localhost:4000/api/health >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1
      - run: npm run test:integration
      - run: npm run test:e2e
      - if: always()
        run: docker compose logs --no-color > docker-compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: docker-compose-log, path: docker-compose.log }
